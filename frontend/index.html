<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tire CRUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Tires</h1>

  <p id="api-info">API: <span id="api-base"></span></p>
  <p id="message"></p>

  <!-- Create / Update form -->
  <h2 id="form-title">Add a tire</h2>
  <form id="tire-form">
    <p>
      <label for="brand">Brand</label><br />
      <input type="text" id="brand" name="brand" minlength="2" maxlength="50" required />
    </p>

    <p>
      <label for="type">Type</label><br />
      <select id="type" name="type" required>
        <option value="">-- choose --</option>
        <option value="Summer">Summer</option>
        <option value="Winter">Winter</option>
        <option value="AllSeason">AllSeason</option>
      </select>
    </p>

    <p>
      <label for="rimDiameter">Rim diameter (inches, 13-24)</label><br />
      <input type="number" id="rimDiameter" name="rimDiameter" min="13" max="24" step="1" required />
    </p>

    <p>
      <label for="price">Price (max 2 decimals)</label><br />
      <input type="number" id="price" name="price" min="0.01" max="10000" step="0.01" required />
    </p>

    <p>
      <label for="imageUrl">Image URL (http/https)</label><br />
      <input type="url" id="imageUrl" name="imageUrl" required />
    </p>

    <p>
      <button type="submit" id="submit-button">Add</button>
      <button type="button" id="cancel-button" hidden>Cancel</button>
    </p>
  </form>

  <p id="errors"></p>

  <h2>All tires</h2>
  <button type="button" id="refresh-button">Refresh</button>

  <table id="tire-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Brand</th>
        <th>Type</th>
        <th>Rim</th>
        <th>Price</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tire-table-body"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
